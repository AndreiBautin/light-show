<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Show</title>
    <meta
      name="description"
      content="Classic screensavers, rebuilt in WebGL and played by your music."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Visualisation" role="img"></canvas>
    <main id="intro" aria-labelledby="title">
      <h1 id="title">Light Show</h1>
      <p class="tagline">Classic screensavers, played by your music.</p>

      <section aria-labelledby="sound-heading">
        <h2 id="sound-heading">Sound</h2>
        <div class="choices">
          <button id="demo" type="button" aria-pressed="false">Demo track</button>
          <button id="tab" type="button" aria-pressed="false" hidden>Browser tab</button>
          <button id="mic" type="button" aria-pressed="false">Microphone</button>
          <label class="file" id="file-label">
            File<input id="file" type="file" accept="audio/*" />
          </label>
        </div>
        <p class="note" id="sound-note">The demo is silent: it only drives the visuals.</p>
      </section>

      <p id="status" role="status"></p>

      <section aria-labelledby="scene-heading">
        <h2 id="scene-heading">Screensaver</h2>
        <div id="scenes" class="choices"></div>
        <p class="note" id="scene-about"></p>
        <button id="auto" type="button" class="auto" aria-pressed="true">
          Auto-change on the drop
        </button>
      </section>

      <p class="build">
        <a href="https://github.com/AndreiBautin/light-show">Source on GitHub</a
        ><span id="build"></span>
      </p>
      <p class="hint">
        <kbd>←</kbd> <kbd>→</kbd> screensaver · <kbd>A</kbd> auto · <kbd>F</kbd> fullscreen ·
        <kbd>H</kbd> hide · on touch: swipe and tap
      </p>
    </main>
    <div id="caption" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
