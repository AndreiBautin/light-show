<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Show</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <main id="intro">
      <h1>Light Show</h1>
      <p>Abstract light that moves with your music.</p>
      <div class="actions">
        <button id="demo" type="button">Play demo (silent)</button>
        <button id="mic" type="button">Listen to microphone</button>
        <label class="file">Play a file<input id="file" type="file" accept="audio/*" /></label>
      </div>
      <p id="status" role="status"></p>
      <div class="scenes-row">
        <div id="scenes" class="scenes" aria-label="Screensaver"></div>
        <button id="auto" type="button" class="auto">Auto: on</button>
      </div>
      <p class="hint">← → change screensaver · A auto · F fullscreen · H hide this panel</p>
    </main>
    <div id="caption" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
